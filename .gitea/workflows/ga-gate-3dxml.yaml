# P3-M5-T02: the P3 GA gate -- corpus of 3DXML opens; surfaces tessellate;
# round-trip stable. New workflow file (NOT ci.yaml) so it cannot collide with
# the P2-M6-T03 gate job that edits ci.yaml on its own open branch. Checkout
# uses the TRIGGERING ref (same pattern as the precommit-gate workflow) so the
# gate tests the branch/pull under validation, not the default branch.
name: P3 GA gate (3DXML)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ga-gate-3dxml:
    name: ga-gate-3dxml
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Checkout triggering ref
        run: |
          apt-get update -qq && apt-get install -y -qq git ca-certificates
          git init -q
          git remote add origin "http://${{ secrets.GITEA_TOKEN }}@192.168.0.101:3200/isolith/isolith.git"
          git fetch -q --depth 1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
      - name: P3 GA gate acceptance (TDD)
        run: |
          if [ ! -f tests/ga_gate_3dxml_test.py ]; then
            echo "P3 gate acceptance test not present on this ref (pre-gate main); skipping"
            exit 0
          fi
          python3 tests/ga_gate_3dxml_test.py
      - name: P3 GA gate run (tolerant on absent corpus, fail on mismatch)
        run: |
          if [ ! -f python/oep_tooling/ga_gate_3dxml.py ]; then
            echo "P3 gate module not present on this ref; skipping"
            exit 0
          fi
          PYTHONPATH=python python3 -m oep_tooling.ga_gate_3dxml --out corpus || exit 1
