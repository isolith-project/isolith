# P9-M5-T02: the P9 GA gate -- 100-job render/convert wave across 3+ nodes,
# outputs verified in the P8 vault. Separate workflow file (NOT ci.yaml): the
# P2/P3/P4/P8 gate convention is one new workflow per GA gate. Checkout uses
# the TRIGGERING ref (same pattern as the P8 gate), so a PR branch's own gate
# runs against the branch under validation.
#
# CI has no fleet and no real CGR corpus, so this job runs the gate's
# CI-safe degraded path (`--local-only`): the REAL oep-pdm vault + the REAL
# oep-ga-gate driver + the REAL worker functions + REAL PDM re-hash on the
# committed STEP/oep-geo corpus. The 3-node fleet proof is a live-LAN action
# documented in scripts/p9m5t02-ga-gate-proof.sh and workstreams/P9-M5/ga-gate.md.
name: P9 GA gate (100-job render/convert wave, outputs verified in PDM)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ga-gate-p9:
    name: ga-gate-p9
    runs-on: ubuntu-latest
    container:
      image: rust:1-slim-bookworm
    steps:
      - name: Checkout triggering ref
        run: |
          apt-get update -qq && apt-get install -y -qq git ca-certificates python3 python3-pytest
          git init -q
          git remote add origin "http://${{ secrets.GITEA_TOKEN }}@192.168.0.101:3200/keelworks/keelworks.git"
          git fetch -q --depth 1 origin "${{ github.ref }}"
          git checkout -q FETCH_HEAD
          git log --oneline -1
      - name: Build gate + vault binaries
        run: cargo build -p oep-gate -p oep-pdm --bins 2>&1 | tail -5
      - name: P9 GA gate acceptance (TDD)
        run: |
          if [ ! -f tests/ga_gate_p9_test.py ]; then
            echo "P9 gate acceptance test not present on this ref; skipping"
            exit 0
          fi
          python3 tests/ga_gate_p9_test.py
      - name: P9 GA gate run (real vault, local-only degraded wave)
        run: |
          if [ ! -f python/oep_tooling/ga_gate_p9.py ]; then
            echo "P9 gate module not present on this ref; skipping"
            exit 0
          fi
          mkdir -p /tmp/p9g-out /tmp/p9g-persist
          PYTHONPATH=python:python/oep_tooling python3 -m oep_tooling.ga_gate_p9 \
            --repo "$PWD" \
            --fleet workstreams/P9-M5/fleet.local.json \
            --jobs-count 100 \
            --driver "$PWD/target/debug/oep-ga-gate" \
            --agent "$PWD/target/debug/oep-ga-node" \
            --pdm "$PWD/target/debug/oep-pdm" \
            --persist /tmp/p9g-persist \
            --report /tmp/p9g-out/ga-gate-p9 \
            --local-only \
            --timeout 1500
          code=$?
          test "$code" -eq 0
