# Keelworks P0-M4-T03: nightly stress run.
# Runs the long fuzz/regression suite on a schedule (02:00 UTC) and on demand,
# publishes the status page + JSON report as artifacts, and turns the nightly
# run red (non-zero exit) when any lane fails or times out.
#
# The runner itself is platform-neutral Python (ci/stress/); this workflow only
# drives it. Local run with the exact same semantics:
#   python3 ci/stress/stress_runner.py --jobs ci/stress/jobs.json
name: nightly-stress
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    container:
      image: rust:1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install python3 (runner is stdlib Python)
        run: apt-get update -qq && apt-get install -y -qq python3

      - name: Run nightly stress suite
        run: |
          python3 ci/stress/stress_runner.py --jobs ci/stress/jobs.json \
            --out-dir docs/status
          rc=$?
          echo "stress_runner exit=$rc"
          exit $rc

      - name: Upload status page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-status
          path: docs/status/status.html

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-stress-report
          path: docs/status/report.json
