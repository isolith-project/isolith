[package]
name = "oep-viewer"
license = "Apache-2.0"
description = "P6-M5-T02: preview viewer (desktop app shell) for oep-geo models - scene, orbit camera, screen-space selection, clip planes, reference software renderer."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
oep-geo = { path = "../oep-geo" }
# UI-D1 UI-GPU-BACKEND (card-mandated dependency): the shared workspace wgpu
# (same version egui 0.37 resolves), used only by the GPU viewport backend.
wgpu = { workspace = true }

[dev-dependencies]
serde_json = "1"
