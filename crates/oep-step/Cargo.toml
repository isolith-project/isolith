[package]
name = "oep-step"
license = "Apache-2.0"
description = "P4: STEP AP242/QIF/JT read lane - vendor-neutral wrapper over an OSS STEP library, mapping faceted parts onto the oep-geo native model."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# P4-M1-T01: wrapped OSS STEP library (pure Rust, MIT OR Apache-2.0), pinned
# per supply-chain doctrine. Library choice: workstreams/step-interop/library-adr/step-library-adr.md.
step-io = { version = "=0.3.0" }
# The canonical native model (dependency-free). oep-step is a leaf reader that
# maps parsed facets onto it (P4 feed for the P6 importer hub).
oep-geo = { path = "../oep-geo" }
# P4-M2-T02: AP242 semantic-PMI round-trip re-export (writer + over-and-back
# reader) into the oep-pmi model. Ported from task/p4m2t02-ap242-export-1016a;
# merged against main's vendor-neutral oep-geo/step-io reader deps.
oep-pmi = { path = "../oep-pmi" }

[dev-dependencies]
serde_json = "1"
