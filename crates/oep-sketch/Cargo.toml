[package]
name = "oep-sketch"
description = "P7: 2D sketcher + parametric variable sets in the chosen shell - declarative sketch model, variable sets (FreeCAD-v1-like semantics), adopted OSS constraint solver behind a vendor-neutral seam, stored as oep-geo features (P7-M4-T01)."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P7-M4-T01: adopted OSS 2D constraint-solver library (MIT stack, pure Rust),
# pinned per supply-chain doctrine. Choice + license posture: workstreams/modeler/sketch-and-rules/sketch-solver-adr.md.
# Reached only through crate::solver - a hidden implementation detail, like
# oep-step wraps step-io. Program posture: Apache-2.0 libraries MAY link a
# permissive library under its own license with notice; no FreeCAD source is
# copied, linked or forked (clean-room invariant, P7-M1).
vcad-kernel-constraints = "=0.10.0"
# The canonical model: sketches and variable sets are stored as oep-geo
# features (P7-M1 shell-contract). oep-geo stays dependency-free.
oep-geo = { path = "../oep-geo" }

[dev-dependencies]
serde_json = "1"
