[package]
name = "oep-update"
license = "Apache-2.0"
description = "P10: self-hosted delivery - advisory, non-blocking, signed update checker (decision #11). The program runs identically whether the update source is found, empty, or unreachable; no update gate ever prevents launch; payloads are consumed only from a signature-verified manifest; feature is disable-able and non-phoning by default."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"

# Signature verification for signed update manifests (P11 signing tie-in).
# Pure-Rust Ed25519; the exact resolution is pinned in the workspace lockfile.
ed25519-dalek = "3"

[features]
# Public builds compile with a baked default remote source (release store
# today, GitHub Releases after the migration - one-line change of
# config::default_public_remote_url). Private / air-gapped / plain source
# builds default to `Off` (non-phoning). See workstreams/delivery/update-checker/update-checker.md.
default = []
public-default-source = []

[dev-dependencies]
# Integration tests generate/sign bundles for the acceptance scenarios.
serde_json = "1"

[[bin]]
name = "oep-update-check"
path = "src/bin/oep-update-check.rs"

[[bin]]
name = "oep-update-sign"
path = "src/bin/oep-update-sign.rs"

[[bin]]
name = "oep"
path = "src/bin/oep.rs"
