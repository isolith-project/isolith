[package]
name = "oep-assem"
description = "P7: Assembly workbench + solver seam (permissive bounded solver, SOLVER-REPLACE; ADR workstreams/P7-M3/solver-adr.md)."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
oep-geo = { path = "../oep-geo" }
# The solver seam delegates the damped Gauss-Newton least-squares lane to the
# program's own kinematics solver (P7-M3-T02), per SOLVER-REPLACE / ADR v1.2.0.
oep-kinematics = { path = "../oep-kinematics" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
