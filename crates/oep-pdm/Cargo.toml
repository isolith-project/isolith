[package]
name = "oep-pdm"
description = "P8: self-hosted PDM / ENOVIA-lite. P8-M1-T01 service skeleton on the ratified web stack (Rust axum, ADR P8-M1/web-stack-adr.md): contract types, vault store, axum service (binary oep-pdm), retained P7-M2-T02 StubServer identity + PdmClient speaking the same OpenAPI v1 contract."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Contract + JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content addressing (P8-M1-T02): file blobs live under their sha-256.
sha2 = "0.10"
# Contract wire encoding for uploads (base64 file content in JSON body).
base64 = "0.22"

# Web stack (P8-M1-T01 decision: P8-M1/web-stack-adr.md, Rust axum).
# Pinned major; the exact resolutions live in the workspace Cargo.lock.
axum = "0.8"
# Single-binary self-hosted server: multi-thread runtime + net (TcpListener)
# + time (graceful-shutdown poll).
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
# P10-M1-T02: native TLS termination (rustls) so the self-hosted PDM can serve
# HTTPS directly on the LAN/web surface. axum-server's rustls path is the
# canonical way to serve an axum router over TLS in axum 0.8; it brings
# tokio-rustls + rustls under the hood (same Rust-first stack as axum).
axum-server = { version = "0.8", features = ["tls-rustls"] }

# PDM relationship graph (P8-M2-T03): ingest real oep-geo assembly
# documents into the uses/composed-of graph and query where-used / impact.
oep-geo = { path = "../oep-geo" }

[[bin]]
name = "oep-pdm"
path = "src/bin/oep-pdm.rs"

# Retained P7-M2-T02 compat binary: same axum service, same contract (see
# src/stub.rs). Keeps the P7 integration surface and the retained contract
# test (tests/test_p8_pdm_stub_contract.py) working unchanged.
[[bin]]
name = "oep-pdm-stub"
path = "src/bin/oep-pdm-stub.rs"
