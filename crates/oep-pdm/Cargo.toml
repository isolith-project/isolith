[package]
name = "oep-pdm"
description = "P8: self-hosted PDM / ENOVIA-lite. REST API v1 stub (P7-M2-T02): contract types, stub server, PdmClient. The real P8 service (P8-M6-T01) implements the same OpenAPI v1 contract."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Contract + JSON. Deps are deliberately minimal: transport is std HTTP/1.1 so
# the stub needs no web framework and P8's real service can swap in cleanly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content addressing (P8-M1-T02): file blobs live under their sha-256.
sha2 = "0.10"
# Contract wire encoding for uploads (base64 file content in JSON body).
base64 = "0.22"

[[bin]]
name = "oep-pdm-stub"
path = "src/bin/oep-pdm-stub.rs"
