[package]
name = "oep-shell"
description = "P7: OEP modeler shell - the adopted thin own shell hosting the OEP interchange workbench command surface (P7-M2-T01) over the importer hub and the P8 PDM API contract."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The workbench is the shell's command surface: it calls the P2/P3/P4 readers
# through the importer hub (one canonical oep-geo format, P6-M4-T02) and the
# P8 PDM API contract (oep-pdm, P7-M2-T01) for PDM load/save. No external
# third-party deps yet; the immediate-mode UI stack lands with the P7-M5 UX
# pass per the P7-M1 shell decision.
oep-import = { path = "../oep-import" }
oep-pdm = { path = "../oep-pdm" }
# The assembly editing surface (EDITOR-ASSEM-EDIT): the solver seam lives in
# oep-assem, the damped Gauss-Newton kinematics lane (P7-M3-T02) in
# oep-kinematics (also its raster, the CPU viewport of this card), and the
# canonical model in oep-geo.
oep-assem = { path = "../oep-assem" }
oep-kinematics = { path = "../oep-kinematics" }
oep-geo = { path = "../oep-geo" }
# The interactive editing surface (INTERACTIVE-SHELL): the sketch model and
# variable set come from oep-sketch, the viewport (camera/render/pick) from
# oep-viewer, both over the same canonical oep-geo model.
oep-sketch = { path = "../oep-sketch" }
oep-viewer = { path = "../oep-viewer" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
