[package]
name = "headless-render"
version = "0.1.0"
edition = "2021"
description = "Keelworks P6-M5-T01 spike: prove wgpu renders headless (offscreen) on real hardware."
license = "Apache-2.0"

# Standalone spike crate. Deliberately NOT a root workspace member: CI (which
# runs from rust:1-slim-bookworm without a GPU) must not build or test it. It
# is built and run on the reference host (U1) where a GPU and Vulkan exist.
[workspace]

[dependencies]
wgpu = "24"
image = "0.25"
pollster = "0.4"
