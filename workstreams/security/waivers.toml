# P11-T02 dependency CVE release gate - committed waiver register.
#
# This is the authoritative waiver file for the SBOM/CVE release gate
# (python/oep_tooling/sbom_cve.py). The gate reads it on every release scan
# (workstreams/security/sbom-cve.md runbook, v1.0.0) and BLOCKS the release (exit 1) on any
# UNFIXED finding at block_severity that is not matched by a non-revoked entry
# here.
#
# Three scopes of waiver appear:
#   * rustsec:<id>            - a RustSec advisory on the crate dependency tree
#     (from the committed Cargo.lock).
#   * image:<image>:<pkg>     - an OS-package CVE group found by `trivy image`
#     against the built release container image. A package waiver covers every
#     open critical/high CVE on that package in that image, so the waiver file
#     does not churn as trivy's DB publishes new ids for an already-reviewed
#     package; the exact CVE ids live in the committed scan report
#     (workstreams/security/proof/trivy-image-findings.json).
#   * osv:<id>                - (reserved) an OSV cross-check finding.
#
# Policy: block_severities = critical, high. moderate/low/informational never
# block but are reported. A waiver requires id + package + date + owner + a
# documented reason. Revoking = set revoked = true. The gate is the source of
# truth: an entry that does not match, a revoked entry, or a NEW blocking
# finding on a package with no waiver all fail the release.
#
# 2026-10-18 green baseline: the Rust crate tree scans clean at block severity
# (one informational RustSec hit, ring 0.17.14 / RUSTSEC-2025-0007, is
# non-blocking and reported, not waived). The keelworks/oep-stack:0.1.0
# runtime image (debian:bookworm-slim + curl/ca-certificates for in-container
# health checks) carries the OS-package critical/high findings waived below.

[policy]
block_severities = ["critical", "high"]

version = "1"


[[waiver]]
id = "image:keelworks/oep-stack:bsdutils"
package = "bsdutils"
date = "2026-10-18"
owner = "release-eng"
reason = "High OS-level findings (CVE-2026-53613, CVE-2026-53615, CVE-2026-76642, CVE-2026-78408, CVE-2026-78409, CVE-2026-78410) in the debian:bookworm-slim runtime base of keelworks/oep-stack. Runtime binds 127.0.0.1 only (decision #10); curl/ca-certificates are in-container health-check tooling, not a network service. Tracked via trivy at every release drill; remediation = rebuild pulls current bookworm-slim point release + bookworm-security; reviewed each release; block if severity/exploitability changes."


