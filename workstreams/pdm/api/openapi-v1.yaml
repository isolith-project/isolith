# OEP PDM REST API v1 -- OpenAPI contract
#
# Owner: P7-M2-T02 (stub-first browser/PDM integration). Inherited by P8-M6-T01
# ("REST API v1 + python client; OpenAPI spec as the contract").
#
# The stub server ships with the P7 modeler lane (crates/oep-pdm, binary
# `oep-pdm-stub`). The real P8 service comes online by implementing this exact
# contract at the same base path; the client that the OEP workbench/browser uses
# (crates/oep-pdm `client`) then keeps working with no rewrite.
#
# Base path: all resources live under /api/v1 regardless of host/port.
# Declared once here (servers.url) so code generators and tools resolve the
# contract root unambiguously; the serving binaries implement exactly this.
servers:
  - url: /api/v1
    description: OEP PDM REST API v1 contract root.
#
# Object model (P8-M1-T02 vault model, subset): Item -> Revision -> File(file blob).
# Files are content-addressed: every file ref carries blob_sha256. Relationship
# and context objects are deferred to P8-M1-T02/P8-M3; v1 carries item.context
# as a free string so clients round-trip it without loss.
#
# Conventions:
#   * Uploads: file content is base64-encoded inside the JSON body (single-shot
#     atomic revision create). A streaming/multipart upload path may be added by
#     P8 later WITHOUT breaking this contract (new endpoint, not a change).
#   * Downloads: raw bytes, Content-Type application/octet-stream (or stored
#     content_type), metadata in X-Oep-* / X-Blob-Sha256 response headers.
#   * Errors: {"error": {"code": ..., "message": ...}} with the listed status.
openapi: 3.0.3
info:
  title: OEP PDM REST API
  version: 1.0.0
  description: >-
    Self-hosted PDM / ENOVIA-lite vault service (Keelworks P8). v1 is the
    stub-first contract: items, revisions, content-addressed files, open and
    save-revision verbs. P8-M6-T01 implements this same contract for real.
tags:
  - name: health
  - name: items
  - name: revisions
  - name: files
paths:
  /health:
    get:
      tags: [health]
      summary: Service liveness + contract identity.
      operationId: health
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /items:
    get:
      tags: [items]
      summary: List items (browser catalogue). Newest first.
      operationId: listItems
      parameters:
        - in: query
          name: prefix
          required: false
          schema: { type: string }
          description: Filter by item-name prefix.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Item catalogue page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
    post:
      tags: [items]
      summary: Create a vault item.
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: Item created.
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/items/{item_id}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /items/{item_id}:
    get:
      tags: [items]
      summary: Get one item with its current latest revision number.
      operationId: getItem
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: Item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404':
          $ref: '#/components/responses/Error'
  /items/{item_id}/file/latest:
    get:
      tags: [files]
      summary: >-
        Open-from-PDM: download the latest revision's file bytes in one call.
        The browser uses this after the user picks an item.
      operationId: openLatestFile
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          $ref: '#/components/responses/FileBytes'
        '404':
          $ref: '#/components/responses/Error'
  /items/{item_id}/revisions:
    get:
      tags: [revisions]
      summary: List all revisions of an item, newest first.
      operationId: listRevisions
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: Revisions of the item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionList' }
        '404':
          $ref: '#/components/responses/Error'
    post:
      tags: [revisions]
      summary: >-
        Save-revision-to-PDM: create the next revision of an item and upload its
        file (content-addressed). The stub assigns the next integer revision
        number; the real service applies the P8-M2-T01 state machine.
      operationId: createRevision
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRevisionRequest' }
      responses:
        '201':
          description: Revision created.
          headers:
            Location:
              schema: { type: string }
              description: /api/v1/items/{item_id}/revisions/{rev}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /items/{item_id}/revisions/{rev}:
    get:
      tags: [revisions]
      summary: Get revision metadata (no file bytes).
      operationId: getRevision
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: Revision metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        '404':
          $ref: '#/components/responses/Error'
  /items/{item_id}/revisions/{rev}/file:
    get:
      tags: [files]
      summary: Download a specific revision's file bytes.
      operationId: openRevisionFile
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          $ref: '#/components/responses/FileBytes'
        '404':
          $ref: '#/components/responses/Error'
  # ---------------------------------------------------------------------------
  # P8-M6-T03 additive gate surface (lock / transition / audit). These are NEW
  # paths, additive to the v1 contract: the existing verbs and their byte-exact
  # behavior are unchanged. They expose the real P8-M1-T03 / P8-M2-T01 /
  # P8-M3-T03 lifecycle layers that the P8 GA gate drives over real sockets.
  # ---------------------------------------------------------------------------
  /items/{item_id}/lock:
    post:
      tags: [gate]
      summary: Acquire the working-set lock on an item (P8-M1-T03).
      operationId: acquireLock
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LockAcquireRequest' }
      responses:
        '200':
          description: Lock granted (one-time token + lease expiry).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LockView' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      tags: [gate]
      summary: Release the working-set lock by its token.
      operationId: releaseLock
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LockReleaseRequest' }
      responses:
        '200':
          description: Lock released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LockView' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /items/{item_id}/revisions/{rev}/transition:
    post:
      tags: [gate]
      summary: >-
        Apply a lock-gated lifecycle transition (P8-M2-T01 state machine).
        Releasing requires the live lock token.
      operationId: transitionRevision
      parameters:
        - { $ref: '#/components/parameters/ItemId' }
        - { $ref: '#/components/parameters/Rev' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Revision transitioned to the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error' 
  # ---------------------------------------------------------------------------
  # P8-M5-T02 offline-sync surface (offline working set -> server). Additive
  # to the v1 contract: one offline edit per push, divergence detected by the
  # server on base identity (revision number + content hash), conflicts
  # resolved through the 3-way (base/ours/theirs) merge surface below.
  # ---------------------------------------------------------------------------
  /sync/push:
    post:
      tags: [sync]
      summary: >-
        Push one offline edit with its base identity (P8-M5-T02). The server
        applies it as the item's next revision only when the current head
        equals the stated base_revision + base_blob_sha256; a clean sync is
        201 status:"synced", a divergent head is 409 status:"conflict" and
        records a pending merge at sync_id (no revision created).
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '201':
          description: Clean sync; revision created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResult' }
        '409':
          description: Divergent; pending merge recorded (expected outcome).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResult' }
        '404':
          $ref: '#/components/responses/Error'
  /sync/conflicts/{sync_id}:
    get:
      tags: [sync]
      summary: The three snapshots of a pending merge (base/ours/theirs).
      operationId: getSyncConflict
      parameters:
        - { $ref: '#/components/parameters/SyncId' }
      responses:
        '200':
          description: The pending merge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncConflictView' }
        '404':
          $ref: '#/components/responses/Error'
  /sync/conflicts/{sync_id}/file/{side}:
    get:
      tags: [sync]
      summary: Raw bytes of one side of a pending merge (base, ours, their).
      operationId: openConflictSide
      parameters:
        - { $ref: '#/components/parameters/SyncId' }
        - { $ref: '#/components/parameters/SyncSide' }
      responses:
        '200':
          description: File bytes plus X-Blob-Sha256 metadata headers.
          headers:
            Content-Type:
              schema: { type: string }
            X-Oep-Filename:
              schema: { type: string }
            X-Oep-Format:
              schema: { type: string }
            X-Blob-Sha256:
              schema: { type: string }
              description: Content-address; hex lowercase sha-256 of the body.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /sync/conflicts/{sync_id}/resolve:
    post:
      tags: [sync]
      summary: >-
        Resolve a pending merge by committing a new revision whose file is the
        chosen snapshot (ours/theirs) or a client-provided merged document.
        The returned revision files[0].blob_sha256 is the hash of the resolved
        bytes.
      operationId: resolveConflict
      parameters:
        - { $ref: '#/components/parameters/SyncId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncResolveRequest' }
      responses:
        '201':
          description: Resolution committed as a new revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Revision' }
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error' 
  /audit:
    get:
      tags: [gate]
      summary: View the append-only, tamper-evident audit log (P8-M3-T03).
      operationId: listAudit
      responses:
        '200':
          description: Audit entries (oldest first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditView' }
        '409':
          $ref: '#/components/responses/Error'
  /audit/verify:
    get:
      tags: [gate]
      summary: >-
        Re-derive the tamper-evident audit chain from disk and confirm it is
        intact (head checkpoint matches the log).
      operationId: verifyAudit
      responses:
        '200':
          description: Chain verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditVerifyReply' }
        '409':
          $ref: '#/components/responses/Error' 
components:
  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string }
      description: Vault item id (opaque, url-safe).
    Rev:
      name: rev
      in: path
      required: true
      schema: { type: string }
      description: Revision number as a string ("1", "2", ...).
    SyncId:
      name: sync_id
      in: path
      required: true
      schema: { type: string }
      description: Pending-merge id (server-minted by the sync push).
    SyncSide:
      name: side
      in: path
      required: true
      schema: { type: string, enum: [base, ours, theirs] }
      description: Which snapshot of the pending merge to fetch bytes for.
  responses:
    Error:
      description: Contract error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FileBytes:
      description: File bytes plus metadata headers.
      headers:
        Content-Type:
          schema: { type: string }
          description: application/octet-stream or the stored content_type.
        X-Oep-Item:
          schema: { type: string }
        X-Oep-Rev:
          schema: { type: string }
        X-Oep-Filename:
          schema: { type: string }
        X-Oep-Format:
          schema: { type: string }
        X-Blob-Sha256:
          schema: { type: string }
          description: Content-address; hex lowercase sha-256 of the body.
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: oep-pdm-stub }
        version: { type: string, example: "1.0.0" }
    CreateItemRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [part, assembly, document] }
        description: { type: string }
        owner: { type: string }
        context: { type: string }
    Item:
      type: object
      required: [id, name, kind, latest_revision, revision_count, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        description: { type: string, nullable: true }
        owner: { type: string, nullable: true }
        context: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        latest_revision: { type: string, nullable: true }
        revision_count: { type: integer }
    ItemSummary:
      type: object
      required: [id, name, kind, latest_revision, revision_count]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        latest_revision: { type: string, nullable: true }
        revision_count: { type: integer }
    ItemList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemSummary' }
        total: { type: integer }
    CreateRevisionRequest:
      type: object
      required: [file]
      properties:
        state:
          type: string
          enum: [working, under_review, released, obsolete]
          default: working
        comment: { type: string }
        created_by: { type: string }
        file: { $ref: '#/components/schemas/FileUpload' }
    FileUpload:
      type: object
      required: [filename, format, content]
      properties:
        filename: { type: string, minLength: 1 }
        format: { type: string, minLength: 1, example: step }
        content_type: { type: string, example: application/octet-stream }
        content:
          type: string
          description: base64-encoded file bytes (standard base64 with padding).
    Revision:
      type: object
      required: [number, state, created_at, created_by, files]
      properties:
        number: { type: string, example: "1" }
        state:
          type: string
          enum: [working, under_review, released, obsolete]
        maturity: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        files:
          type: array
          items: { $ref: '#/components/schemas/FileRef' }
    FileRef:
      type: object
      required: [id, filename, format, content_type, size, blob_sha256]
      properties:
        id: { type: string }
        filename: { type: string }
        format: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        blob_sha256:
          type: string
          description: hex lowercase sha-256 of the file bytes.
    SyncPushRequest:
      type: object
      required: [item_id, base_revision, base_blob_sha256, file]
      properties:
        item_id: { type: string, description: The item the offline edit targets }
        base_revision: { type: string, description: The revision the edit was based on }
        base_blob_sha256: { type: string, description: Content address of base_revision's file }
        state:
          type: string
          enum: [working, under_review, released, obsolete]
          default: working
        comment: { type: string }
        created_by: { type: string }
        file: { $ref: '#/components/schemas/FileUpload' }
    SyncPushResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [synced, conflict] }
        revision: { $ref: '#/components/schemas/Revision' }
        sync_id: { type: string }
        base_revision: { type: string }
        base_blob_sha256: { type: string }
        theirs_revision: { type: string }
        theirs_blob_sha256: { type: string }
      description: >-
        Tagged on status: synced (201) carries revision; conflict (409) carries
        sync_id + base/theirs identity and records a pending merge.
    ConflictSide:
      type: object
      required: [revision, filename, format, content_type, size, blob_sha256]
      properties:
        revision: { type: string, nullable: true, description: null for "ours" (no server revision yet) }
        filename: { type: string }
        format: { type: string }
        content_type: { type: string }
        size: { type: integer, format: int64 }
        blob_sha256: { type: string }
    SyncConflictView:
      type: object
      required: [sync_id, item_id, base, ours, theirs]
      properties:
        sync_id: { type: string }
        item_id: { type: string }
        base: { $ref: '#/components/schemas/ConflictSide' }
        ours: { $ref: '#/components/schemas/ConflictSide' }
        theirs: { $ref: '#/components/schemas/ConflictSide' }
    SyncResolveRequest:
      type: object
      required: [choice]
      properties:
        choice: { type: string, enum: [ours, theirs, merged] }
        merged:
          allOf:
            - { $ref: '#/components/schemas/FileUpload' }
          description: Required when choice == merged (the client-merged document).
    RevisionList:
      type: object
      required: [item_id, latest, revisions]
      properties:
        item_id: { type: string }
        latest: { type: string, nullable: true }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/Revision' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: not_found }
        message: { type: string }
    # ---- P8-M6-T03 additive gate surface schemas (lock / transition / audit) ----
    LockAcquireRequest:
      type: object
      required: [holder]
      properties:
        holder: { type: string, minLength: 1, description: Principal acquiring the lock. }
    LockView:
      type: object
      required: [object, holder, token, expires_ms]
      properties:
        object: { type: string }
        holder: { type: string }
        token: { type: string, description: Opaque one-time lock token. }
        expires_ms: { type: integer, description: Lease expiry in unix ms. }
    LockReleaseRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: The token granted at acquire. }
    TransitionRequest:
      type: object
      required: [to, token]
      properties:
        to: { type: string, enum: [working, under_review, released, obsolete] }
        token: { type: string, description: The working-set lock token. }
    AuditEntry:
      type: object
      required: [seq, actor, action, target, at_unix, prev_hash, hash]
      properties:
        seq: { type: integer, description: 1-based sequence number. }
        actor: { type: string, description: Who acted. }
        action: { type: string, enum: [read, change, release] }
        target: { type: string, description: What was acted on. }
        detail: { type: string, nullable: true }
        at_unix: { type: integer, description: Wall-clock unix seconds. }
        prev_hash: { type: string, description: Hash of the previous entry. }
        hash: { type: string, description: This entry's chained SHA-256. }
    AuditView:
      type: object
      required: [entries, count, append_only]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        count: { type: integer }
        append_only: { type: boolean }
    AuditVerifyReply:
      type: object
      required: [ok, count, head_hash]
      properties:
        ok: { type: boolean, description: Whole chain re-verifies. }
        count: { type: integer }
        head_hash: { type: string, description: Chained hash of the last entry. }
        detail: { type: string, nullable: true, description: Tamper evidence when ok is false. }
