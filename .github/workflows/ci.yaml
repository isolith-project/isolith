# GitHub port of .gitea/workflows/ci.yaml. Owns a branch-protection required check; runs on every push and pull request.
name: CI (lint + unit + integration)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Every run step executes under bash so `set -o pipefail` is legal: the slim
# Debian job images ship /bin/sh as dash, which rejects the option and made
# the lint/unit/integration jobs fail before running anything (repo-wide, on
# every ref). bash is present in both rust:1-slim-bookworm and python:3.12-slim.
defaults:
  run:
    shell: bash
jobs:
  # Toolchain: the general rust:1-slim-bookworm image provides rustup; the
  # repo's rust-toolchain.toml (P0-M3-T02) is the single source of truth for
  # the exact channel + components (rustfmt, clippy), auto-installed on first
  # use. CI follows toolchain bumps without editing this file.
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-slim-bookworm
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Trust the workspace for git
        # the job container runs as root while actions/checkout owns the
        # tree as the runner uid, so git rejects it without safe.directory
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse --is-inside-work-tree
          git ls-files --error-unmatch Cargo.toml >/dev/null && echo "index readable"
      - name: rustfmt check
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tail -25

  unit:
    name: unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-slim-bookworm
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Trust the workspace for git
        # the job container runs as root while actions/checkout owns the
        # tree as the runner uid, so git rejects it without safe.directory
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse --is-inside-work-tree
          git ls-files --error-unmatch Cargo.toml >/dev/null && echo "index readable"
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --workspace --lib 2>&1 | tail -25

  integration:
    name: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-slim-bookworm
    steps:
      - name: Install git and a software Vulkan adapter
        # The viewer test suites (gpu_shading, gpu_backend) build a real wgpu
        # backend, so the container needs a Vulkan ICD or the first GPU test
        # panics on "no adapter" while holding the process-global gpu_lock and
        # poisons the rest of the suite as `gpu lock: PoisonError`.
        # mesa-vulkan-drivers ships lavapipe, a conformant software Vulkan
        # implementation, which the Vulkan loader picks up like a physical
        # driver (bookworm installs its ICD as lvp_icd.x86_64.json).
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Assert a software Vulkan adapter is present
        # Fail loudly here instead of letting the GPU suites fail with a
        # poisoned lock, so a silent ICD absence shows up in the log directly.
        run: |
          ls -1 /usr/share/vulkan/icd.d/
          vulkaninfo --summary > /tmp/vulkaninfo-summary.txt 2>&1
          sed -n '1,40p' /tmp/vulkaninfo-summary.txt
          echo "adapter line(s) in the full summary:"
          grep -Ei 'deviceName|driverName|llvmpipe|lavapipe' /tmp/vulkaninfo-summary.txt | head -5 || true
          if ! grep -Eiq 'llvmpipe|lavapipe' /tmp/vulkaninfo-summary.txt; then
            echo "ERROR: no llvmpipe or lavapipe software Vulkan adapter found; the GPU suites cannot run"
            exit 1
          fi
          echo "OK: software Vulkan adapter present in this container"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Trust the workspace for git
        # the job container runs as root while actions/checkout owns the
        # tree as the runner uid, so git rejects it without safe.directory
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse --is-inside-work-tree
          git ls-files --error-unmatch Cargo.toml >/dev/null && echo "index readable"
      - name: Integration tests
        run: |
          set -o pipefail
          cargo test --workspace --tests 2>&1 | tail -25

  # P2-M6-T03: the P2 GA gate -- every corpus mesh classified (OPEN or SKIP,
  # zero panics) AND 100% of golden files PASS within epsilon. Restored here by
  # INTEGRATION-T03 as part of the union verification: the P2 gate runner and
  # acceptance test were ported to integrated main by INTEGRATION-T02 but the
  # CI job itself was missing from the union. This job is the gate's home on
  # main (one workflow per GA gate convention; see ga-gate-p4/p8/p9/p10/p11/p12
  # for the lane gates). Checkout uses the TRIGGERING ref so the gate tests the
  # branch/pull under validation. Degrades to a classified SKIP when corpus
  # material is absent (CI green) while failing hard on any real golden
  # mismatch.
  gate:
    name: gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: python:3.12-slim
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates && python3 -m pip install --quiet pytest
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Trust the workspace for git
        # the job container runs as root while actions/checkout owns the
        # tree as the runner uid, so git rejects it without safe.directory
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse --is-inside-work-tree
          git ls-files --error-unmatch Cargo.toml >/dev/null && echo "index readable"
      - name: GA gate acceptance (TDD)
        run: |
          if [ ! -f tests/ga_gate_test.py ]; then
            echo "gate acceptance test not present on this ref (pre-GA-gate main); skipping"
            exit 0
          fi
          python3 tests/ga_gate_test.py
      - name: GA gate run (tolerant on absent corpus, fail on mismatch)
        run: |
          if [ ! -f python/oep_tooling/ga_gate.py ]; then
            echo "GA gate module not present on this ref; skipping"
            exit 0
          fi
          PYTHONPATH=python python3 -m oep_tooling.ga_gate --out ./corpus || exit 1
