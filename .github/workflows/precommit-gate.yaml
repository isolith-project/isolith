# GitHub port of .gitea/workflows/precommit-gate.yaml. Owns a branch-protection required check; runs on every push and pull request.
# P0-M3-T04: precommit quality gate, enforced in CI.
# Runs the SAME vendored gate script (scripts/gate/precommit-gate.sh) that is
# installed as the local .git/hooks/pre-commit hook, so CI holds every push to
# the identical quality bar developers commit against locally.
#
# Checkout note: we fetch the triggering ref (github.ref) explicitly rather than
# cloning the default branch, so the gate tests the branch/pull being validated
# (its own scripts/gate included), matching the org ci.yaml pattern.
name: Precommit quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rust:1-slim-bookworm
    steps:
      - name: Install git and a software Vulkan adapter
        # Same requirement as the integration job: the precommit gate runs
        # cargo test -q, which builds the viewer GPU suites and needs a Vulkan
        # ICD in the container or gpu_shading and gpu_backend fail with a
        # poisoned gpu_lock (`gpu lock: PoisonError`) instead of running.
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates python3 python3-pytest libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Assert a software Vulkan adapter is present
        # Fail loudly here instead of letting the GPU suites fail with a
        # poisoned lock, so a silent ICD absence shows up in the log directly.
        run: |
          ls -1 /usr/share/vulkan/icd.d/
          vulkaninfo --summary > /tmp/vulkaninfo-summary.txt 2>&1
          sed -n '1,40p' /tmp/vulkaninfo-summary.txt
          echo "adapter line(s) in the full summary:"
          grep -Ei 'deviceName|driverName|llvmpipe|lavapipe' /tmp/vulkaninfo-summary.txt | head -5 || true
          if ! grep -Eiq 'llvmpipe|lavapipe' /tmp/vulkaninfo-summary.txt; then
            echo "ERROR: no llvmpipe or lavapipe software Vulkan adapter found; the GPU suites cannot run"
            exit 1
          fi
          echo "OK: software Vulkan adapter present in this container"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Trust the workspace for git
        # the job container runs as root while actions/checkout owns the
        # tree as the runner uid, so git rejects it without safe.directory
        run: |
          git config --global --add safe.directory "$PWD"
          git rev-parse --is-inside-work-tree
          git ls-files --error-unmatch Cargo.toml >/dev/null && echo "index readable"
      - name: Run precommit quality gate
        run: bash scripts/gate/precommit-gate.sh
