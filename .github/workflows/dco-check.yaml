# DCO sign-off gate (public-surface port of .gitea/workflows/dco.yaml).
#
# GitHub is the live CI (2026-11-19 migration; Gitea is the internal mirror),
# so this file is the active enforcement:
# every commit on the PR branch must carry a `Signed-off-by:` line (the DCO)
# and the PR body must carry one too, gated by branch protection on the
# `dco-sign-off` check.
#
# same scope decision as the Gitea workflow: pull_request events only, never
# push. Merges onto main are the maintainer's lane and the repo's own merge
# commits are not contributor-authored.
#
# The scan logic is shared with the acceptance test (tests/test_dco_check.py)
# via python/oep_tooling/dco_check.py.
name: DCO sign-off
on:
  pull_request:
# PUBLIC-REPO-HARDENING: least privilege (contents read only) and the
# checkout action pinned to the commit SHA behind the release line it
# stands for. See scripts/hardening/check-workflow-hardening.sh (R1/R2).
permissions:
  contents: read
jobs:
  dco-sign-off:
    name: dco-sign-off
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout with full history
        # actions/checkout v4 (release line the SHA pins)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Save PR body
        # The body arrives through the environment, never interpolated into the
        # script: inlining it via toJSON broke python on any body carrying a
        # control character or an apostrophe.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os
          body = os.environ.get('PR_BODY', '')
          with open('/tmp/pr-body.txt', 'w', encoding='utf-8') as fh:
              fh.write(body or '')
          PY
      - name: Run DCO check (commits + PR body)
        run: |
          python3 python/oep_tooling/dco_check.py --repo "$PWD" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --body-file /tmp/pr-body.txt
