# License-boundary gate (public-surface port of
# .gitea/workflows/licensing-boundary.yaml).
#
# GitHub is the live CI since 2026-11-19 (Gitea is the internal mirror), so
# this file is the active enforcement: every push and pull request must keep the per-crate licence
# boundary (docs/licensing-boundary.json), the Cargo.toml SPDX declarations,
# the dependency allow-list (docs/dependency-licenses.json), NOTICE, and the
# root licence files in sync, gated by branch protection on the
# `licensing-boundary` check.
#
# The scan logic is shared with the local runs via scripts/licensing-check.py
# (stdlib, offline: crate boundary, boundary-doc sync, dependency allow-list,
# NOTICE sync, root files). Exit 0 iff no FAIL row.
name: License boundary
on:
  push:
    branches: [main]
  pull_request:
# PUBLIC-REPO-HARDENING: least privilege and SHA-pinned checkout (R1/R2).
permissions:
  contents: read
jobs:
  licensing-boundary:
    name: licensing-boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # actions/checkout v4 (release line the SHA pins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce the per-crate licence boundary and dependency allow-list
        run: python3 scripts/licensing-check.py --repo "$PWD" --out -
        shell: bash
