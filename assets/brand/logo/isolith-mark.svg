<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t0 d0">
  <title id="t0">Isolith mark</title>
  <desc id="d0">A clean isometric cube: plate-blue top face with two nested section-plate rhombi (the Isolith strata signature), ink left face, steel right face. Solid, symmetric, engineered.</desc>
  <g>
    <!-- top face: 'plate' -->
    <polygon points="48,12 16,32 48,52 80,32" fill="#1D5B9E"/>
    <!-- nested strata plate 1 -->
    <polygon points="48,17.5 21,34 48,50.5 75,34" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- nested strata plate 2 -->
    <polygon points="48,23 26,34 48,45 70,34" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.2"/>
    <!-- left face: 'ink' -->
    <polygon points="16,32 48,52 48,76 16,56" fill="#0F2A43"/>
    <!-- right face: 'steel' -->
    <polygon points="80,32 48,52 48,76 80,56" fill="#7C94AD"/>
  </g>
</svg>
