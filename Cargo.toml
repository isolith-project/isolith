# Isolith / Open Engineering Platform -- Rust workspace root.
#
# One crate per workstream (see docs/layout.md for the full mapping).
# Toolchain pinning (edition bumps, rust-toolchain.toml, lockfile policy) is
# owned by P0-M3-T02 -- this file only defines the workspace member layout.
#
# SPDX license for each crate is set by the P0-M2 legal pass, not here.

[workspace]
resolver = "2"
members = [
    "crates/oep-cgr",
    "crates/oep-3dxml",
    "crates/oep-import",
    "crates/oep-geo",
    "crates/oep-engine-occ",
    "crates/oep-viewer",
    "crates/oep-render-worker",
    "crates/oep-web",
    "crates/oep-step",
    "crates/oep-step-pmi",
    "crates/oep-pmi",
    "crates/oep-qif",
    "crates/oep-pdm",
    "crates/oep-archive",
    "crates/oep-shell",
    "crates/oep-kinematics",
    "crates/oep-rules",
    "crates/oep-sketch",
    "crates/oep-assem",
    "crates/oep-analysis",
    "crates/oep-app",
    "crates/oep-ui-theme",
    "crates/oep-job",
    "crates/oep-lane",
    "crates/oep-farm",
    "crates/oep-worker",
    "crates/oep-sandbox",
    "crates/oep-state",
    "crates/oep-fairshare",
    "crates/oep-opsdash",
    "crates/oep-gate",
    "crates/oep-update",
    "crates/oep-docs",
    "crates/oep-drafting",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Isolith contributors"]
repository = "https://github.com/isolith-project/isolith"

# UI dependency baseline (editor parity program, wave A, card UI-A1).
# eframe/egui pinned at 0.37.x, resolved once and recorded in Cargo.lock.
# Default renderer (glow) only; the wgpu backend is wave D's subject.
[workspace.dependencies]
eframe = { version = "0.37.0" }
egui = { version = "0.37.0" }
wgpu = { version = "30.0.2" }
