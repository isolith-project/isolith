# Isolith Python tooling workspace (P0-M3-T02).
#
# Python is the tooling/scripting language (master plan Decision 6: Rust-first for
# core, Python allowed for tooling/scripts). This workspace pins the interpreter
# version (.python-version) and resolves dependencies with `uv lock` -> uv.lock.
# Reproducibility doctrine (P11-T06): never install deps without the lockfile.

[project]
name = "isolith-tooling"
version = "0.1.0"
description = "Isolith / Open Engineering Platform - Python tooling and corpus scripts"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false   # tooling workspace, not a publishable library
